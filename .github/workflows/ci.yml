name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile is committed yet (generated on first install with registry access);
      # switch to `npm ci` once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install --no-audit --no-fund && npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: node apps/web/dev/e2e.mjs
        env: { E2E_BROWSER: chromium }
