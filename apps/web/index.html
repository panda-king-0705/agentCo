<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AgentCo Console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='6' rx='1.5' fill='%232a78d6'/%3E%3Crect x='3' y='13' width='26' height='6' rx='1.5' fill='%2314181c'/%3E%3Crect x='3' y='21' width='26' height='6' rx='1.5' fill='%231baf7a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script>
      try {
        var t = localStorage.getItem("agentco.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The AgentCo console needs JavaScript.</noscript>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
